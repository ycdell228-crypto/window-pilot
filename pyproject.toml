[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "window-pilot"
version = "0.2.1"
description = "Windows window control and isolated headless local-site browser sessions for MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.scripts]
window-pilot = "window_pilot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
