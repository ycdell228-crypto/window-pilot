name: Windows tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ordinary checks (native desktop input skipped)
        env:
          CI: '1'
          WINDOW_PILOT_NATIVE_TESTS: '0'
        shell: pwsh
        run: ./scripts/test.ps1 -Python python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ordinary-test-summary
          path: .local/test-results/summary.json
      - name: Build and install wheel in a clean environment (no desktop input)
        shell: pwsh
        run: |
          ./scripts/build-wheel.ps1 -Python python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-wheel.py dist/window_pilot-0.1.0-py3-none-any.whl --evidence .local/wheel-smoke
